// MKS Planetary Logistics offload model: a net producer whose surplus is drained
// into the infinite planetary pool through a converter gated on the tank being at
// or above the 75% offload trigger. The tank should be held at the trigger and the
// full surplus routed into the pool.
//
//   index 0: real warehouse tank (LiquidFuel), at 75% of capacity
//   index 1: the planetary pool as seen from this vessel (infinite MaxAmount)
//   converter 0: colony producer, +10/s LiquidFuel into the tank
//   converter 1: push transfer, tank -> pool, gated AT_LEAST 75
BRP_SHIP
{
    lastUpdate = 0
    nextChangepoint = 0
    BackgroundProcessingActive = True

    INVENTORY
    {
        flightId = 1
        resourceName = LiquidFuel
        amount = 75
        maxAmount = 100
    }
    INVENTORY
    {
        flightId = 0
        resourceName = LiquidFuel
        amount = 1000
        maxAmount = Infinity
    }

    CONVERTER
    {
        nextChangepoint = Infinity
        rate = 0

        PUSH_INVENTORIES
        {
            index = 0
        }

        OUTPUT_RESOURCE
        {
            ResourceName = LiquidFuel
            Ratio = 10
            FlowMode = ALL_VESSEL
        }
    }

    CONVERTER
    {
        nextChangepoint = Infinity
        rate = 0

        PULL_INVENTORIES
        {
            index = 0
        }
        PUSH_INVENTORIES
        {
            index = 1
        }
        CONSTRAINT_INVENTORIES
        {
            index = 0
        }

        INPUT_RESOURCE
        {
            ResourceName = LiquidFuel
            Ratio = 10
            FlowMode = ALL_VESSEL
        }
        OUTPUT_RESOURCE
        {
            ResourceName = LiquidFuel
            Ratio = 10
            FlowMode = ALL_VESSEL
        }
        REQUIRED_RESOURCE
        {
            ResourceName = LiquidFuel
            Amount = 75
            Constraint = AT_LEAST
            FlowMode = ALL_VESSEL
        }
    }
}
