// MKS Planetary Logistics refill model: a net consumer whose deficit is drawn from
// the planetary pool through a converter gated on the tank being at or below the 25%
// refill trigger. The tank should be held at the trigger while the pool has balance,
// and the pool should drain at the consumption rate.
//
//   index 0: real warehouse tank (LiquidFuel), at 25% of capacity
//   index 1: the planetary pool as seen from this vessel (finite balance of 100)
//   converter 0: colony consumer, -10/s LiquidFuel from the tank
//   converter 1: pull transfer, pool -> tank, gated AT_MOST 25
BRP_SHIP
{
    lastUpdate = 0
    nextChangepoint = 0
    BackgroundProcessingActive = True

    INVENTORY
    {
        flightId = 1
        resourceName = LiquidFuel
        amount = 25
        maxAmount = 100
    }
    INVENTORY
    {
        flightId = 0
        resourceName = LiquidFuel
        amount = 100
        maxAmount = Infinity
    }

    CONVERTER
    {
        nextChangepoint = Infinity
        rate = 0

        PULL_INVENTORIES
        {
            index = 0
        }

        INPUT_RESOURCE
        {
            ResourceName = LiquidFuel
            Ratio = 10
            FlowMode = ALL_VESSEL
        }
    }

    CONVERTER
    {
        nextChangepoint = Infinity
        rate = 0

        PULL_INVENTORIES
        {
            index = 1
        }
        PUSH_INVENTORIES
        {
            index = 0
        }
        CONSTRAINT_INVENTORIES
        {
            index = 0
        }

        INPUT_RESOURCE
        {
            ResourceName = LiquidFuel
            Ratio = 10
            FlowMode = ALL_VESSEL
        }
        OUTPUT_RESOURCE
        {
            ResourceName = LiquidFuel
            Ratio = 10
            FlowMode = ALL_VESSEL
        }
        REQUIRED_RESOURCE
        {
            ResourceName = LiquidFuel
            Amount = 25
            Constraint = AT_MOST
            FlowMode = ALL_VESSEL
        }
    }
}
