// A converter whose AT_LEAST constraint only looks at a local tank, on a vessel
// that also carries a large central tank of the same resource.
//
// UpdateConstraintState evaluates the constraint against the converter's
// CONSTRAINT_INVENTORIES set, so the boundary it will actually flip at is
// inventory 0 crossing 5000 units, which happens 10s from now. Predicting the
// crossing from vessel-wide totals instead sees 54000 units against a
// requirement of 5000, concludes the boundary is already well behind us, and
// discards the changepoint entirely — leaving only inventory 0 filling up at
// t = 960 and letting the converter run 950s past its constraint flip.
BRP_SHIP
{
	lastUpdate = 0
	nextChangepoint = Infinity

	// The local tank the constraint is actually watching.
	INVENTORY
	{
		flightId = 0
		resourceName = ElectricCharge
		amount = 4000
		maxAmount = 100000
		rate = 100
	}
	// A big central tank the converter's flow mode cannot reach.
	INVENTORY
	{
		flightId = 1
		resourceName = ElectricCharge
		amount = 50000
		maxAmount = 100000
		rate = 0
	}

	CONVERTER
	{
		nextChangepoint = Infinity
		rate = 0

		CONSTRAINT_INVENTORIES
		{
			index = 0
		}

		REQUIRED_RESOURCE
		{
			ResourceName = ElectricCharge
			Amount = 5000
			Constraint = AT_LEAST
			FlowMode = NO_FLOW
		}
	}
}
