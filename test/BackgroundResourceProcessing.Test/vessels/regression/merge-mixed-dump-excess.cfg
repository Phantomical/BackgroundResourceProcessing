// Two converters that output the same resource to the same full inventory,
// where only the first one dumps its excess. This is how the SystemHeat
// auto-throttle reactor is modelled: a mandatory floor that dumps EC, and a
// demand-driven remainder that doesn't.
//
// MergeEquivalentConverters used to merge these into one converter, keeping
// only the first converter's DumpExcess flag. The merged converter then dumped
// the second converter's EC too, so it kept running with the battery full.
BRP_SHIP
{
	lastUpdate = 0
	nextChangepoint = Infinity

	// Full.
	INVENTORY
	{
		flightId = 0
		resourceName = ElectricCharge
		amount = 100
		maxAmount = 100
	}

	CONVERTER
	{
		nextChangepoint = Infinity
		rate = 0

		PUSH_INVENTORIES
		{
			resourceName = ElectricCharge
			index = 0
		}

		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 20
			DumpExcess = True
			FlowMode = ALL_VESSEL
		}
	}

	CONVERTER
	{
		nextChangepoint = Infinity
		rate = 0

		PUSH_INVENTORIES
		{
			resourceName = ElectricCharge
			index = 0
		}

		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 180
			DumpExcess = False
			FlowMode = ALL_VESSEL
		}
	}
}
