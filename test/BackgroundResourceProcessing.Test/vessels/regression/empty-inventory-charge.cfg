BRP_SHIP
{
    lastUpdate = 0
    nextChangepoint = 0
    BackgroundProcessingActive = True

    // An empty ElectricCharge store that has both a producer (e.g. a solar
    // panel) and a consumer (e.g. an antenna) attached. The net production is
    // strongly positive (+10 - 1 = +9) so the store should charge.
    //
    // Regression for a solver bug where the `iRate >= 0` empty-inventory
    // constraint negated the stored rate equation in place, making the
    // post-solve rate read back as negative. The store was then treated as
    // draining (and, being empty, clamped to 0), so empty batteries under
    // load never started charging.
    INVENTORY
    {
        flightId = 0
        resourceName = ElectricCharge
        amount = 0
        maxAmount = 100
    }

    CONVERTER
    {
        nextChangepoint = Infinity
        rate = 0

        PUSH_INVENTORIES
        {
            index = 0
        }

        OUTPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 10
            FlowMode = ALL_VESSEL
        }
    }

    CONVERTER
    {
        nextChangepoint = Infinity
        rate = 0

        PULL_INVENTORIES
        {
            index = 0
        }

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 1
            FlowMode = ALL_VESSEL
        }
    }
}
