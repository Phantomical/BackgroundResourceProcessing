// A dumpExcess converter and an ordinary converter sharing a full tank, where
// the ordinary converter can also reach a second, empty tank.
//
// Converter 0 is processed first and, because its output dumps excess, it
// creates the dRates entry for inventory 0. Converter 1 then splits its output
// across both inventories, which is the branch that adds the converter's
// aggregate output rate to dRates instead of the per-inventory split variable.
//
// Inventory 0 is full, so its constraint is dRate <= 0. With the aggregate rate
// in there that reads "converter 1 must not run at all"; correctly it reads
// "converter 1 must route none of its output into inventory 0", which it can
// satisfy by sending all of it to inventory 1 instead.
BRP_SHIP
{
	lastUpdate = 0
	nextChangepoint = Infinity

	// Full. Reachable from both converters.
	INVENTORY
	{
		flightId = 0
		resourceName = Ore
		amount = 100
		maxAmount = 100
	}
	// Empty. Reachable only from converter 1, which keeps the two inventories
	// from being merged together before the solve.
	INVENTORY
	{
		flightId = 1
		resourceName = Ore
		amount = 0
		maxAmount = 100
	}

	CONVERTER
	{
		nextChangepoint = Infinity
		rate = 0

		PUSH_INVENTORIES
		{
			resourceName = Ore
			index = 0
		}

		OUTPUT_RESOURCE
		{
			ResourceName = Ore
			Ratio = 1
			DumpExcess = True
			FlowMode = ALL_VESSEL
		}
	}

	CONVERTER
	{
		nextChangepoint = Infinity
		rate = 0

		PUSH_INVENTORIES
		{
			resourceName = Ore
			index = 0
			index = 1
		}

		OUTPUT_RESOURCE
		{
			ResourceName = Ore
			Ratio = 2
			DumpExcess = False
			FlowMode = ALL_VESSEL
		}
	}
}
