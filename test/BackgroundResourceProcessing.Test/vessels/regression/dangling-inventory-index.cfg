// The converter on this vessel refers to inventory indices that do not exist,
// as a hand-edited (or truncated) save file might. Loading it must drop the
// dangling references instead of throwing partway through and taking down the
// load of the entire vessel.
//
// Aside from the extra indices this is a copy of constraint/at-least-enabled.cfg.
BRP_SHIP
{
    lastUpdate = 0
    nextChangepoint = 0
    BackgroundProcessingActive = True

    INVENTORY
    {
        flightId = 0
        resourceName = LiquidFuel
        amount = 100
        maxAmount = 100
    }
    INVENTORY
    {
        flightId = 1
        resourceName = ElectricCharge
        amount = 9000
        maxAmount = 10000
    }

    CONVERTER
    {
        nextChangepoint = Infinity
        rate = 0

        PUSH_INVENTORIES
        {
            index = 1
            index = 9
        }
        PULL_INVENTORIES
        {
            // This one doesn't even fit in an int.
            index = 4294967295
            index = 0
        }
        CONSTRAINT_INVENTORIES
        {
            index = 1
            index = 7
        }

        INPUT_RESOURCE
        {
            ResourceName = LiquidFuel
            Ratio = 1
            FlowMode = ALL_VESSEL
        }
        OUTPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 100
            FlowMode = ALL_VESSEL
        }
        REQUIRED_RESOURCE
        {
            ResourceName = ElectricCharge
            Amount = 5000
            Constraint = AT_LEAST
            FlowMode = ALL_VESSEL
        }
    }
}
