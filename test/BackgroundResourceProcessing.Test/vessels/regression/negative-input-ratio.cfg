// A converter with a negative input ratio, which a malformed config or a
// misbehaving behaviour can produce.
//
// Nothing validates the sign anywhere between the behaviour and the LP, so the
// negative ratio is subtracted from the inventory rate and comes back out as
// net production: the tank gains LiquidFuel at 1/s from nothing at all, with no
// log line to say so.
BRP_SHIP
{
	lastUpdate = 0
	nextChangepoint = Infinity

	// Half full, so it is unconstrained and any rate the solver picks is
	// acceptable.
	INVENTORY
	{
		flightId = 0
		resourceName = LiquidFuel
		amount = 50
		maxAmount = 100
	}

	CONVERTER
	{
		nextChangepoint = Infinity
		rate = 0

		PULL_INVENTORIES
		{
			resourceName = LiquidFuel
			index = 0
		}

		INPUT_RESOURCE
		{
			ResourceName = LiquidFuel
			Ratio = -1
			FlowMode = ALL_VESSEL
		}
	}
}
